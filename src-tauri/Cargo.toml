[package]
name = "story-architect-desktop"
version = "4.0.0"
description = "Story Architect Desktop App (Tauri v2)"
authors = ["Story Architect Team"]
edition = "2021"

[lib]
name = "story_architect_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
